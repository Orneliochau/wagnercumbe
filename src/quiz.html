<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionário | Máquina Oculta</title>
<meta name="robots" content="noindex">
<meta name="description" content="Responda ao questionário de qualificação da Máquina Oculta.">
<link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">
<style>
:root{
  --radius:.375rem;
  --background:oklch(98.5% .004 60);
  --foreground:oklch(20% .01 30);
  --card:oklch(100% 0 0);
  --primary:oklch(56% .22 27);
  --primary-foreground:oklch(99% .005 60);
  --muted:oklch(95.5% .006 50);
  --muted-foreground:oklch(50% .015 40);
  --border:oklch(90% .008 45);
  --primary-soft:oklch(56% .22 27 / 8%);
  --font-display:"Arial Black","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--background);
  color:var(--foreground);
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:2.5rem 1.25rem 4rem;
}
.wrap{width:100%;max-width:36rem}
.brand{display:flex;align-items:center;justify-content:center;gap:.75rem;margin-bottom:2rem}
.brand span{height:1px;width:2rem;background:var(--primary)}
.brand p{font-family:var(--font-display);font-weight:900;font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;color:var(--primary);margin:0}

.eyebrow{display:flex;align-items:center;justify-content:space-between;font-size:.75rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-foreground)}
.progress-track{margin-top:.5rem;height:.5rem;border-radius:999px;background:var(--muted);overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:var(--primary);transition:width .35s ease}

.question{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:1.25rem;line-height:1.3;margin:1.75rem 0 1.25rem}
@media (min-width:640px){.question{font-size:1.4rem}}

.options{display:flex;flex-direction:column;gap:.9rem;margin-bottom:1.75rem}
.option{
  text-align:left;
  width:100%;
  border:1.5px solid var(--border);
  background:var(--card);
  border-radius:calc(var(--radius) + 4px);
  padding:1rem 1.15rem;
  font-size:.95rem;
  color:var(--foreground);
  cursor:pointer;
  transition:border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
}
.option:hover{border-color:oklch(56% .22 27 / 45%)}
.option.selected{
  border-color:var(--primary);
  background:var(--primary-soft);
  box-shadow:0 0 0 1px var(--primary);
}

.btn-continue{
  width:100%;
  border:none;
  border-radius:calc(var(--radius) + 2px);
  background:var(--primary);
  color:var(--primary-foreground);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.02em;
  font-size:.9rem;
  padding:1.05rem 1.5rem;
  cursor:pointer;
  box-shadow:0 0 24px oklch(58% .22 27 / 30%);
  transition:transform .15s ease, opacity .15s ease;
}
.btn-continue:hover:not(:disabled){transform:scale(1.01)}
.btn-continue:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

.btn-back{
  display:block;
  margin:.9rem auto 0;
  background:none;
  border:none;
  color:var(--muted-foreground);
  font-size:.75rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
}
.btn-back:hover{color:var(--foreground)}

.field{margin-bottom:1.5rem}
.field label{display:block;font-weight:700;font-size:.95rem;margin-bottom:.5rem}
.field input,.field select{
  width:100%;
  border:1.5px solid var(--border);
  background:var(--card);
  border-radius:calc(var(--radius) + 4px);
  padding:.85rem 1.1rem;
  font-size:1rem;
  color:var(--foreground);
  font-family:inherit;
  appearance:auto;
}
.field input:focus,.field select:focus{outline:2px solid var(--primary);outline-offset:1px}

.result-card{
  background:var(--card);
  border-radius:calc(var(--radius) + 12px);
  box-shadow:0 20px 25px -5px rgb(0 0 0 / 10%), 0 8px 10px -6px rgb(0 0 0 / 10%);
  padding:2.5rem 2rem;
  text-align:center;
  max-width:26rem;
  margin:4.5rem auto 0;
}
.result-card h1{
  font-family:var(--font-display);
  font-weight:900;
  text-transform:uppercase;
  color:var(--primary);
  font-size:1.75rem;
  margin:0 0 .9rem;
}
.result-card p{margin:0 0 .5rem;font-size:.95rem;line-height:1.5}
.result-card .lead{font-weight:700;color:var(--foreground)}
.result-card .muted{color:var(--muted-foreground);font-size:.85rem}
.btn-whatsapp{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.5rem;
  width:100%;
  margin:1.5rem 0 1rem;
  border-radius:999px;
  background:var(--primary);
  color:var(--primary-foreground);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.02em;
  font-size:.9rem;
  padding:1.05rem 1.5rem;
  text-decoration:none;
  box-shadow:0 0 24px oklch(58% .22 27 / 30%);
  transition:transform .15s ease;
}
.btn-whatsapp:hover{transform:scale(1.02)}

[hidden]{display:none !important}
</style>
<script>window.MO_CONFIG=/*MO_CONFIG*/{};</script>
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
(function(){
  var c=window.MO_CONFIG||{};
  if(!c.pixelId)return;
  window.moPageViewId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
  fbq('init',c.pixelId);
  fbq('track','PageView',{},{eventID:window.moPageViewId});
})();
</script>
</head>
<body>
<div class="wrap">
  <div class="brand"><span></span><p>Máquina Oculta</p><span></span></div>

  <div id="mo-quiz">
    <div class="eyebrow"><span>Questionário</span><span id="mo-step-label">1/5</span></div>
    <div class="progress-track"><div class="progress-fill" id="mo-progress" style="width:20%"></div></div>
    <h2 class="question" id="mo-question"></h2>

    <div id="mo-form" hidden>
      <div class="field">
        <label for="mo-nome">Nome</label>
        <input type="text" id="mo-nome" autocomplete="name" placeholder="O seu nome completo">
      </div>
      <div class="field">
        <label for="mo-idade">Idade</label>
        <input type="number" id="mo-idade" min="1" max="120" inputmode="numeric" placeholder="A sua idade">
      </div>
      <div class="field">
        <label for="mo-provincia">Província</label>
        <select id="mo-provincia">
          <option value="">Seleccione…</option>
          <option>Niassa</option>
          <option>Cabo Delgado</option>
          <option>Nampula</option>
          <option>Zambézia</option>
          <option>Tete</option>
          <option>Manica</option>
          <option>Sofala</option>
          <option>Inhambane</option>
          <option>Gaza</option>
          <option selected>Maputo</option>
          <option>Maputo Cidade</option>
        </select>
      </div>
    </div>

    <div class="options" id="mo-options"></div>
    <button class="btn-continue" id="mo-continue" disabled>Continuar →</button>
    <button class="btn-back" id="mo-back" hidden>Voltar</button>
  </div>

  <div id="mo-result" hidden>
    <div class="result-card">
      <h1>Parabéns!</h1>
      <p class="lead">Você tem um perfil qualificado para uma das 100 vagas.</p>
      <p class="muted">Estarei no dia 26 de setembro, às 15h.</p>
      <a class="btn-whatsapp" id="mo-whatsapp" href="https://wa.link/vboj7y">Quero garantir a minha vaga →</a>
      <p class="muted">As vagas são limitadas a 100 pessoas.</p>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Ligação final do quiz — mantenha este link como a única fonte de verdade.
  var WHATSAPP_URL = 'https://wa.link/vboj7y';

  // Passo 1 (índice 0) é o formulário "Os seus dados" — tratado à parte, não está nesta lista.
  var QUESTIONS = [
    {
      q: 'Qual é a sua experiência com marketing digital?',
      options: [
        'Nunca trabalhei com marketing digital.',
        'Já tentei, mas ainda não consegui resultados.',
        'Já faço algumas vendas pela internet.',
        'Já tenho um negócio de marketing digital e quero crescer.'
      ]
    },
    {
      q: 'Se você entrar para a mentoria e conseguir construir a sua máquina digital, quanto gostaria de ganhar?',
      options: [
        '20.000 MT por mês',
        '50.000 MT por mês',
        '100.000 MT por mês'
      ]
    },
    {
      q: 'Se você alcançasse esse objectivo, o que mudaria primeiro na sua vida?',
      options: [
        'Ajudaria a minha mãe/família.',
        'Compraria um terreno.',
        'Compraria um carro.',
        'Pagaria a minha faculdade.'
      ]
    },
    {
      q: 'Agora imagine que surgisse uma oportunidade para realizar aquilo que você acabou de descrever. Você faria o necessário para entrar?',
      options: [
        'Sim, claro.',
        'Sem dúvidas.',
        'Criaria formas mesmo sem dinheiro.',
        'Sim, faria de tudo para conseguir.'
      ]
    }
  ];

  // current: 0 = formulário "Os seus dados"; 1..QUESTIONS.length = perguntas de escolha.
  var TOTAL = 1 + QUESTIONS.length;
  var current = 0;
  var selections = new Array(QUESTIONS.length).fill(null);
  var lead = { nome: '', idade: '', provincia: 'Maputo' };

  var $quiz = document.getElementById('mo-quiz');
  var $result = document.getElementById('mo-result');
  var $stepLabel = document.getElementById('mo-step-label');
  var $progress = document.getElementById('mo-progress');
  var $question = document.getElementById('mo-question');
  var $form = document.getElementById('mo-form');
  var $options = document.getElementById('mo-options');
  var $continue = document.getElementById('mo-continue');
  var $back = document.getElementById('mo-back');
  var $whatsapp = document.getElementById('mo-whatsapp');
  var $nome = document.getElementById('mo-nome');
  var $idade = document.getElementById('mo-idade');
  var $provincia = document.getElementById('mo-provincia');

  $whatsapp.setAttribute('href', WHATSAPP_URL);

  function isFormValid() {
    return lead.nome.trim().length > 1 && Number(lead.idade) > 0 && lead.provincia !== '';
  }

  function syncLeadFromInputs() {
    lead.nome = $nome.value;
    lead.idade = $idade.value;
    lead.provincia = $provincia.value;
  }

  [$nome, $idade, $provincia].forEach(function (el) {
    el.addEventListener('input', function () {
      syncLeadFromInputs();
      $continue.disabled = !isFormValid();
    });
  });

  function render() {
    $stepLabel.textContent = (current + 1) + '/' + TOTAL;
    $progress.style.width = (((current + 1) / TOTAL) * 100) + '%';
    $back.hidden = current === 0;

    if (current === 0) {
      $question.textContent = 'Os seus dados';
      $form.hidden = false;
      $options.hidden = true;
      $options.innerHTML = '';
      $nome.value = lead.nome;
      $idade.value = lead.idade;
      $provincia.value = lead.provincia || 'Maputo';
      $continue.disabled = !isFormValid();
      $continue.textContent = 'Continuar →';
      return;
    }

    $form.hidden = true;
    $options.hidden = false;

    var qIndex = current - 1;
    var step = QUESTIONS[qIndex];
    $question.textContent = step.q;

    $options.innerHTML = '';
    step.options.forEach(function (label, idx) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option' + (selections[qIndex] === idx ? ' selected' : '');
      btn.textContent = label;
      btn.addEventListener('click', function () {
        selections[qIndex] = idx;
        render();
      });
      $options.appendChild(btn);
    });

    $continue.disabled = selections[qIndex] === null;
    $continue.textContent = current === TOTAL - 1 ? 'Ver meu resultado →' : 'Continuar →';
  }

  $continue.addEventListener('click', function () {
    if (current === 0) {
      syncLeadFromInputs();
      if (!isFormValid()) return;
    } else if (selections[current - 1] === null) {
      return;
    }

    if (current < TOTAL - 1) {
      current += 1;
      render();
    } else {
      showResult();
    }
  });

  $back.addEventListener('click', function () {
    if (current === 0) return;
    current -= 1;
    render();
  });

  function showResult() {
    $quiz.hidden = true;
    $result.hidden = false;
    trackLead();
  }

  function trackLead() {
    var data = {
      content_name: 'Quiz Máquina Oculta',
      nome: lead.nome,
      idade: lead.idade,
      provincia: lead.provincia
    };

    var c = window.MO_CONFIG || {};
    if (!c.pixelId) return;
    var id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    if (typeof window.fbq === 'function') window.fbq('track', 'Lead', data, { eventID: id });
    try {
      fetch('/api/capi', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        keepalive: true,
        body: JSON.stringify({
          event_name: 'Lead',
          event_id: id,
          event_source_url: window.location.href,
          custom_data: data
        })
      }).catch(function () {});
    } catch (e) { /* ignora */ }
  }

  render();
})();
</script>
</body>
</html>
